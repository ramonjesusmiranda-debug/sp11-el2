# 18-10-2026: si la Surface se cuelga (bloqueo duro o blando) que entre en pánico, guarde el registro en una variable
# EFI (efi_pstore; systemd-pstore lo pasa a /var/lib/systemd/pstore al arrancar) y se reinicie sola a los 15 s.
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 1
kernel.panic = 15
