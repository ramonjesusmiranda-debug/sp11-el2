# Surface Pro 11 en EL2 (17-10-2026): el decodificador Iris (/dev/video0) falla en EL2 (ENOMEM) y su nodo de vídeo
# deja colgada la cola de eventos de WirePlumber: ni perfiles ni puertos ni enlaces de audio. El audio no necesita V4L2.
# 25-10-2026: Iris ya funciona en EL2 (parche 177) y sale de la lista negra; esto se queda: las cámaras van por
# libcamera y Iris (m2m) no necesita el monitor V4L2.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    # 24-10-2026: libcamera activado para las cámaras (camss no es Iris; Iris va por monitor.v4l2)
    monitor.libcamera = optional
  }
}
